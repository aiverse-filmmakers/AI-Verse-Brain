[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-verse-brain"
dynamic = ["version"]
description = "Universal deterministic intelligence control layer for AI agents"
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.scripts]
ai-verse-brain = "aiverse_brain.cli:main"

[tool.setuptools]
packages = ["aiverse_brain"]
package-dir = {aiverse_brain = "engine/aiverse_brain"}

[tool.setuptools.dynamic]
version = {attr = "aiverse_brain._version.__version__"}
