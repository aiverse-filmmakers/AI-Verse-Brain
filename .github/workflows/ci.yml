name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install wheel into clean environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --upgrade pip
          .smoke/bin/python -m pip install dist/*.whl
      - name: Exercise installed CLI
        run: |
          .smoke/bin/ai-verse-brain --help
          mkdir .smoke-root
          .smoke/bin/ai-verse-brain init .smoke-root --apply
          .smoke/bin/ai-verse-brain doctor .smoke-root || test $? -eq 2
          .smoke/bin/ai-verse-brain migrate .smoke-root
          test -f .smoke-root/.ai-verse-brain/installation.json
